<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - পেজটি পাওয়া যায়নি | Civil 4th Semester</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .error-code {
      font-size: 100px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1e3c72;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 16px;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 5px 20px rgba(255, 140, 0, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 140, 0, 0.6);
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
      display: block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .error-code { font-size: 70px; }
      h1 { font-size: 20px; }
      .container { padding: 40px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">📚</span>
    <div class="error-code">404</div>
    <h1>পেজটি পাওয়া যায়নি!</h1>
    <p>আপনি যে পেজটি খুঁজছেন সেটি নেই, সরিয়ে ফেলা হয়েছে, বা লিংকটি ভুল।</p>
    <a href="/" class="btn">🏠 হোমপেজে ফিরে যান</a>
  </div>
</body>
</html>
