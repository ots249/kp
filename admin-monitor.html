<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;background:#f5f7fa;color:#172033;margin:0;padding:20px}main{max-width:760px;margin:auto}section,.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}nav a,button{padding:10px 14px;border-radius:10px;background:#2563eb;color:white;text-decoration:none;border:0;font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;box-sizing:border-box;font:inherit;margin:6px 0}small{color:#64748b} </style></head><body><main><nav><a href="/new.html">Dashboard</a><a href="/admin-add.html">Add / Manage</a><a href="/admin-notification.html">Notifications</a><a href="/admin-track.html">Tracking</a><a href="/admin-monitor.html">Monitor</a></nav><section><h1>System Monitor</h1><p>Basic checks from this browser.</p><button id="check">Run checks</button><div id="out"></div></section><script>document.getElementById('check').onclick=async()=>{const o=document.getElementById('out');o.textContent='Checking…';const checks=[['Course API','https://sheetapi249.vercel.app/api/v1/diploma-tutor/Sheet1'],['Push subscription endpoint','/api/push/subscribe'],['Custom push endpoint','/api/push/send-custom'],['Tracking endpoint','/api/push/tracking']];let html='';for(const [n,u] of checks){try{const r=await fetch(u,{method:'GET'});html+='<section><b>'+n+'</b>: HTTP '+r.status+' (endpoint reachable/check response)</section>'}catch(e){html+='<section><b>'+n+'</b>: unreachable</section>'}}o.innerHTML=html}</script></main></body></html>
