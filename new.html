<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Civil 4th Diploma Tutor — Add Resource</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; color: #1a2b45; }
  p.sub { color: #6b7a90; margin: 0 0 24px; font-size: .9rem; }
  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: #34455c;
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d3dae3;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #3b7ddd;
    box-shadow: 0 0 0 3px rgba(59,125,221,.15);
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 13px;
    background: #3b7ddd;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #2f66b8; }
  button:disabled { background: #9db6d6; cursor: not-allowed; }
  .msg {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    font-size: .9rem;
    display: none;
  }
  .msg.ok  { background: #e6f7ed; color: #1b7a43; display: block; }
  .msg.err { background: #fdecec; color: #b42318; display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Civil 4th Diploma Tutor</h1>
    <p class="sub">Add a new lecture resource.</p>

    <form id="entryForm">
      <label for="subject">Subject</label>
      <select id="subject" name="subject" required>
        <option value="" disabled selected>Select subject…</option>
        <option>Accounting</option>
        <option>Estimating &amp; Costing 1</option>
        <option>Geotechnical Engineering</option>
        <option>Surveying 2</option>
      </select>

      <label for="chapter">Chapter</label>
      <input id="chapter" name="chapter" type="text" required placeholder="e.g. Chapter 3" />

      <label for="lecture">Lecture</label>
      <input id="lecture" name="lecture" type="text" required placeholder="e.g. Lecture 5" />

      <label for="type">Type</label>
      <select id="type" name="type" required>
        <option value="" disabled selected>Select type…</option>
        <option value="video">Video</option>
        <option value="pdf">PDF</option>
      </select>

      <label for="link">Link</label>
      <input id="link" name="link" type="url" required placeholder="https://…" />

      <button type="submit" id="submitBtn">Submit</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

<script>
  const URL  = 'https://api.sheety.co/821ecc958a063a3a52c103e87f8a214f/civil4ThDiplomaTutor/sheet1';
  const form = document.getElementById('entryForm');
  const btn  = document.getElementById('submitBtn');
  const msg  = document.getElementById('msg');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    msg.className = 'msg';

    const body = {
      sheet1: {
        subject: form.subject.value,
        chapter: form.chapter.value.trim(),
        lecture: form.lecture.value.trim(),
        type:    form.type.value,
        link:    form.link.value.trim()
      }
    };

    try {
      const res = await fetch(URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
          // 'Authorization': 'Bearer YOUR_TOKEN'  // uncomment if sheet is private
        },
        body: JSON.stringify(body)
      });

      const json = await res.json();
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);

      console.log('Created row:', json.sheet1);
      show('✅ Added successfully!', 'ok');
      form.reset();
    } catch (err) {
      console.error(err);
      show('❌ ' + err.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });
</script>
</body>
</html>
