<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোটিশ | ক্লাস আপডেট</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* মেইন কার্ড */
        .notice-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* হেডার */
        .notice-header {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            padding: 22px 20px 20px;
            position: relative;
            overflow: hidden;
        }

        /* বড় বৃত্ত (ডান দিকে) */
        .notice-header::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        /* ছোট বৃত্ত (বাম দিকে) */
        .notice-header::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .header-top h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .header-top h1 span {
            font-weight: 300;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 500;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* বডি */
        .notice-body {
            padding: 20px 20px 8px;
            background: #ffffff;
        }

        /* মেইন মেসেজ */
        .main-message {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #3b82f6;
            border-radius: 16px;
            padding: 18px 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.06);
        }

        .main-message p {
            font-size: 16.5px;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.75;
        }

        .main-message .highlight {
            color: #2563eb;
            font-weight: 700;
            background: #eff6ff;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
            line-height: 1.4;
        }

        /* সেকেন্ডারি মেসেজ */
        .secondary-message {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 16px;
            padding: 18px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .secondary-message .icon {
            font-size: 26px;
            line-height: 1;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .secondary-message p {
            font-size: 16px;
            font-weight: 400;
            color: #854d0e;
            line-height: 1.7;
        }

        .secondary-message p strong {
            font-weight: 700;
            color: #713f12;
        }

        /* ফুটার */
        .notice-footer {
            padding: 18px 20px 22px;
            background: #ffffff;
            border-top: 1px solid #f1f5f9;
            margin-top: 12px;
        }

        .date-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 14px;
        }

        .date-badge .cal-icon {
            font-size: 18px;
        }

        .footer-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.3px;
        }

        /* রেস্পন্সিভ */
        @media (max-width: 420px) {
            body { padding: 12px; }

            .notice-header { padding: 20px 18px 18px; }

            .header-top h1 { font-size: 20px; }

            .icon-badge { width: 44px; height: 44px; font-size: 22px; }

            .notice-body { padding: 18px 18px 6px; }

            .main-message { padding: 16px; }

            .main-message p { font-size: 15.5px; }

            .secondary-message { padding: 16px; }

            .secondary-message p { font-size: 15px; }

            .notice-footer { padding: 16px 18px 20px; }

            .date-badge { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="notice-card">
        <!-- হেডার -->
        <div class="notice-header">
            <div class="header-top">
                <div class="icon-badge">📢</div>
                <h1>নোটিশ <span>বোর্ড</span></h1>
            </div>
            <div class="badge-live">
                <span class="dot"></span>
                লাইভ আপডেট
            </div>
        </div>

        <!-- বডি -->
        <div class="notice-body">
            <!-- মেইন মেসেজ -->
            <div class="main-message">
                <p>
                    সকল বিষয়ের <span class="highlight">Chapter ও Lecture</span> এর সব ক্লাস সময়মতো দেওয়া হচ্ছে...
                </p>
            </div>

            <!-- সেকেন্ডারি মেসেজ -->
            <div class="secondary-message">
                <span class="icon">📚</span>
                <p>
                    সাথে নিচে কিছু বিষয়ের <strong>পুরাতন ক্লাসও</strong> দেওয়া আছে।
                </p>
            </div>
        </div>

        <!-- ফুটার -->
        <div class="notice-footer">
            <div class="date-badge">
                <span class="cal-icon">📅</span>
                <span id="currentDate"></span>
            </div>
            <span class="footer-tag">আপডেটেড</span>
        </div>
    </div>

    <script>
        (function() {
            const dateEl = document.getElementById('currentDate');
            if (dateEl) {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                };
                dateEl.textContent = now.toLocaleDateString('bn-BD', options);
            }
        })();
    </script>

</body>
</html>
