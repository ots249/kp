<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;background:#f5f7fa;color:#172033;margin:0;padding:20px}main{max-width:760px;margin:auto}section,.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}nav a,button{padding:10px 14px;border-radius:10px;background:#2563eb;color:white;text-decoration:none;border:0;font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;box-sizing:border-box;font:inherit;margin:6px 0}small{color:#64748b} </style></head><body><main><nav><a href="/new.html">Dashboard</a><a href="/admin-add.html">Add / Manage</a><a href="/admin-notification.html">Notifications</a><a href="/admin-track.html">Tracking</a><a href="/admin-monitor.html">Monitor</a></nav><section><h1>Notification Tracking</h1><p>Recent custom push delivery and click records.</p><label>Push Admin Secret</label><input id="secret" type="password" autocomplete="off" placeholder="Admin Secret"><small>Shared in browser local storage with Add/Manage.</small><script>const S='civil4th_push_admin_secret';const i=document.getElementById('secret');i.value=localStorage.getItem(S)||'';i.oninput=()=>i.value.trim()?localStorage.setItem(S,i.value.trim()):localStorage.removeItem(S);</script><button id="refresh">Refresh tracking</button><div id="result"></div></section><script>document.getElementById('refresh').onclick=async()=>{const w=document.getElementById('result'),secret=document.getElementById('secret').value.trim();if(!secret)return alert('Admin secret required');w.textContent='Loading…';try{const r=await fetch('/api/push/tracking',{headers:{'X-Admin-Secret':secret}}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Load failed');w.innerHTML=d.notifications.length?d.notifications.map(x=>'<section><b>'+escapeHtml(x.title)+'</b><p>'+escapeHtml(x.message)+'</p><small>'+new Date(x.sentAt).toLocaleString()+'</small><p>Sent: '+Number(x.sent||0)+' • Failed: '+Number(x.failed||0)+' • Clicks: '+Number(x.clicks||0)+' • Removed: '+Number(x.removed||0)+'</p></section>').join(''):'No records yet'}catch(e){w.textContent=e.message}};function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></main></body></html>
