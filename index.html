<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil 4th Semester | Diploma Civil Study Resources</title>
    <meta name="description" content="Civil 4th Semester Diploma Engineering study resources, lecture notes, PDFs and class videos for Civil Technology students.">
    <link rel="stylesheet" href="style.css">

    <!-- Establish early connections only to critical external origins -->
    <link rel="preconnect" href="https://i.postimg.cc" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Prioritize the above-the-fold LCP banner -->
    <link rel="preload" as="image" href="https://i.postimg.cc/MKx5W94w/4thct.webp" fetchpriority="high">

    <!-- Non-blocking icon and font stylesheets -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></noscript>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

    <!-- Analytics are loaded after first interaction or a short idle delay -->
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Civil 4th">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Icons for iOS (নতুন লোগো) -->
    <link rel="apple-touch-icon" href="https://i.postimg.cc/7YKJhGyY/logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://i.postimg.cc/7YKJhGyY/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/7YKJhGyY/logo.png">
    <link rel="apple-touch-icon" sizes="167x167" href="https://i.postimg.cc/7YKJhGyY/logo.png">
    
    <!-- Startup Image for iOS -->
    <link rel="apple-touch-startup-image" href="https://i.postimg.cc/7YKJhGyY/logo.png">
    
    <!-- Additional Meta Tags -->
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>

</head>
<body>
	<!-- Day/Night Mode Toggle Button -->
	<button id="theme-toggle" class="theme-toggle-btn" aria-label="ডে/নাইট মোড">
	<i class="fas fa-sun"></i>
	</button>
    <div class="app">
        <!-- Banner/Live Video Section -->
        <div class="banner-container" id="banner-container">
            <img src="https://i.postimg.cc/MKx5W94w/4thct.webp" alt="কোর্স ব্যানার" class="banner-image" id="banner-image" width="1280" height="668" fetchpriority="high" decoding="async">
            <div class="live-video-container" id="live-video-container" style="display: none;">
                <iframe 
                    id="live-video-frame"
                    class="live-video-frame"
                    src=""
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Header with subtle gradient -->
        <header class="header">
            <div class="header-content">
                <h1 id="course-title">Civil 4th Semester Course</h1>
            </div>
        </header>

        <!-- Progress Summary -->
        <div class="progress-summary" id="progress-summary">
            <span class="progress-summary-text">সর্বমোট অগ্রগতি</span>
            <div class="progress-summary-bar">
                <div class="progress-summary-fill" id="global-progress-fill" style="width: 0%"></div>
            </div>
            <span class="progress-summary-percent" id="global-progress-text">0%</span>
        </div>

        <!-- Main Content -->
        <main class="main">
            <!-- Sections Container -->
            <div class="sections-container" id="sections-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>লোড হচ্ছে...</p>
                </div>
            </div>
        </main>

        <!-- Footer with Install Button -->
        <footer class="footer">
            <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                <button id="install-button" class="install-btn" style="display: none;">
                    <i class="fas fa-download"></i> অ্যাপ ইন্সটল করুন
                </button>
                <button id="reset-progress" class="reset-btn">
                    <i class="fas fa-redo-alt"></i> প্রোগ্রেস রিসেট
                </button>
            </div>
            <p>&copy; ২০২৬ OTS • সর্বস্বত্ব সংরক্ষিত</p>
        </footer>
    </div>
	<!-- Floating Reload Button - WhatsApp style -->
	<button id="floating-reload-btn" class="floating-reload-btn" aria-label="রিফ্রেশ করুন">
	<i class="fas fa-sync-alt"></i>
	</button>
    <script>
      (function () {
        let analyticsLoaded = false;
        function loadAnalytics() {
          if (analyticsLoaded) return;
          analyticsLoaded = true;

          const umami = document.createElement('script');
          umami.defer = true;
          umami.src = 'https://cloud.umami.is/script.js';
          umami.dataset.websiteId = 'b8159591-1c2c-47fd-af61-28c2cd4adc57';
          document.head.appendChild(umami);

          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-RTHT9NVFND');

          const ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-RTHT9NVFND';
          document.head.appendChild(ga);
        }

        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (eventName) {
          window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
        });
        window.addEventListener('load', function () {
          window.setTimeout(loadAnalytics, 8000);
        }, { once: true });
      })();
    </script>
    <script src="script.js" defer></script>
</body>
</html>
