<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;background:#f5f7fa;color:#172033;margin:0;padding:20px}main{max-width:760px;margin:auto}section,.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}nav a,button{padding:10px 14px;border-radius:10px;background:#2563eb;color:white;text-decoration:none;border:0;font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:10px;box-sizing:border-box;font:inherit;margin:6px 0}small{color:#64748b} </style></head><body><main><nav><a href="/new.html">Dashboard</a><a href="/admin-add.html">Add / Manage</a><a href="/admin-notification.html">Notifications</a><a href="/admin-track.html">Tracking</a><a href="/admin-monitor.html">Monitor</a></nav><section><h1>Custom Push Notifications</h1><p>Send a notification to subscribed devices.</p><label>Push Admin Secret</label><input id="secret" type="password" autocomplete="off" placeholder="Admin Secret"><small>Shared in browser local storage with Add/Manage.</small><script>const S='civil4th_push_admin_secret';const i=document.getElementById('secret');i.value=localStorage.getItem(S)||'';i.oninput=()=>i.value.trim()?localStorage.setItem(S,i.value.trim()):localStorage.removeItem(S);</script><label>Title</label><input id="title" maxlength="120" placeholder="Announcement title"><label>Message</label><textarea id="message" maxlength="500" rows="4" placeholder="Notification text"></textarea><label>Target URL (optional)</label><input id="target" placeholder="/"><button id="send">Send Custom Notification</button><p id="status"></p></section><script>document.getElementById('send').onclick=async()=>{const secret=document.getElementById('secret').value.trim(),title=document.getElementById('title').value.trim(),message=document.getElementById('message').value.trim(),target=document.getElementById('target').value.trim()||'/';if(!secret||!title||!message)return alert('Secret, title and message are required');let u;try{u=new URL(target,location.origin);if(u.origin!==location.origin)throw 0}catch{return alert('Same-app URL required')}if(!confirm('Send to all subscribed devices?'))return;const b=document.getElementById('send'),st=document.getElementById('status');b.disabled=true;st.textContent='Sending…';try{const r=await fetch('/api/push/send-custom',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Secret':secret},body:JSON.stringify({title,message,url:u.pathname+u.search+u.hash})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Send failed');st.textContent='Sent: '+d.sent+' • Failed: '+d.failed+' • Removed: '+d.removed;document.getElementById('title').value='';document.getElementById('message').value='';document.getElementById('target').value='';}catch(e){st.textContent=e.message}finally{b.disabled=false}};</script></main></body></html>
